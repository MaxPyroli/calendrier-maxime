name: Actualiser le calendrier

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      essai:
        description: "Essai du menu : affiche la forme des réponses myMRS et le menu, ne publie rien"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - template.html
      - weekly.py
      - filter_calendar.py
      - rules.json
      - menu.py
      - template_menu.html
      - requirements.txt
      - tests/**
      - .github/workflows/calendar.yml

# Le site est servi par GitHub Pages depuis la branche main (racine) :
# le workflow régénère index.html puis le commit seulement si la génération réussit.
permissions:
  contents: write

concurrency:
  group: calendrier
  cancel-in-progress: false

jobs:
  actualiser:
    runs-on: ubuntu-latest
    env:
      MYMRS_TOKEN: ${{ secrets.MYMRS_TOKEN }}
      MYMRS_LOGIN: ${{ secrets.MYMRS_LOGIN }}
      MYMRS_PASSWORD: ${{ secrets.MYMRS_PASSWORD }}
      MYMRS_PASSWORD_HEX: ${{ secrets.MYMRS_PASSWORD_HEX }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover -s tests -v

      # Échoue sans rien publier si la source est vide ou invalide :
      # la dernière version en ligne reste alors en place.
      - name: Générer la page
        run: python weekly.py

      # Menu de la cantine (myMRS). Étape facultative : sans secrets, ou en cas d'échec,
      # le calendrier est publié quand même et le dernier menu enregistré reste affiché.
      - name: Générer le menu de la cantine
        if: ${{ (env.MYMRS_TOKEN != '' || env.MYMRS_LOGIN != '') && !inputs.essai }}
        run: |
          # Si myMRS refuse l'accès, on reconstruit quand même la page (nouvelle mise en page)
          # depuis le dernier menu enregistré et on le signale par un avertissement.
          if ! python menu.py; then
            echo "::warning title=Menu cantine::myMRS a refusé l'accès, le menu n'est pas actualisé (voir l'erreur ci-dessus)."
            python menu.py --render-only || true
          fi

      # Lancement manuel avec « essai » : montre ce que myMRS renvoie (sans données personnelles)
      # puis le menu obtenu, et s'arrête là sans rien publier.
      - name: Essai du menu (rien n'est publié)
        if: ${{ inputs.essai }}
        run: |
          python menu.py --diagnostic
          python menu.py --output "$RUNNER_TEMP/menu.html"
          python - <<'PY'
          import json, os
          page = open(os.path.join(os.environ['RUNNER_TEMP'], 'menu.html'), encoding='utf-8').read()
          data = json.loads(page.split('id="data">')[1].split('</script>')[0])
          for day in data['days']:
              print(day['date'])
              for restaurant in day['restaurants']:
                  print('  ', restaurant['name'])
                  for item in restaurant['items']:
                      print('     ', item['type'], ':', item['label'])
          PY

      - name: Publier si la page a changé
        if: ${{ !inputs.essai }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html audit.json
          for f in menu.html menu.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then
            echo "Aucun changement à publier."
            exit 0
          fi
          git commit -m "Actualise le calendrier ($(date -u '+%Y-%m-%d %H:%M') UTC)"
          git push
