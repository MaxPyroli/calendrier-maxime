<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu de la cantine</title>
<style>
:root{font-family:system-ui,sans-serif;color:#172e32;background:#f3f5f2}*{box-sizing:border-box}body{margin:0}
main{max-width:460px;margin:auto;padding:20px 16px 28px}
.eyebrow{font-size:12px;letter-spacing:2px;font-weight:700;color:#397266;text-transform:uppercase}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 10px;margin-bottom:14px}
h1{flex:1 0 100%;order:3;margin:0;font-size:21px;line-height:1.25}
nav{display:flex;gap:6px}
button{font:inherit;font-size:14px;min-width:34px;height:34px;padding:0 10px;border:1px solid #c8d6d0;border-radius:10px;background:#fff;color:#173f42;cursor:pointer}
button:hover:not(:disabled){background:#e8f1ee}button:disabled{opacity:.35;cursor:default}
.card{margin:0 0 12px;padding:14px 14px 6px;border:1px solid #d9e4df;border-radius:16px;background:#fff;box-shadow:0 1px 2px rgba(23,46,50,.04)}
.card h2{margin:0 0 6px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:#397266}
.dish{--tint:#e8efec;--ink:#5d7a73;display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid #edf2ef}
.dish:first-of-type{border-top:0}
.tile{flex:0 0 44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:23px;line-height:1;background:var(--tint)}
.text{min-width:0}
.type{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--ink)}
.label{font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.badge{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:#fdeccd;color:#8a5a00;font-size:10.5px;font-weight:700;letter-spacing:0;text-transform:none;white-space:nowrap}
.green{--tint:#dff2e3;--ink:#2f7a4a}.blue{--tint:#dcecf7;--ink:#2b6f9e}.orange{--tint:#fbe3d6;--ink:#b4501f}
.red{--tint:#fbdede;--ink:#b03a3a}.purple{--tint:#e9e1f5;--ink:#6a4aa3}.amber{--tint:#fbefcf;--ink:#9a6b00}
.next{margin-top:14px}.next summary{cursor:pointer;padding:6px 0 10px;font-size:13px;font-weight:700;color:#5d7a73}
.next .card{background:rgba(255,255,255,.6)}
footer{margin-top:16px;font-size:12px;color:#5d7a73}footer a{color:inherit}
.warn{margin:0 0 12px;padding:9px 12px;border-radius:12px;background:#fdeccd;color:#8a5a00;font-size:12.5px;line-height:1.4}
</style></head><body><main>
<header><div class="eyebrow">🍴 Cantine</div>
<nav aria-label="Choisir un jour"><button id="prev" aria-label="Jour précédent">←</button><button id="today">Aujourd’hui</button><button id="next" aria-label="Jour suivant">→</button></nav><h1 id="title"></h1></header>
<div id="alert"></div><div id="menu" aria-live="polite"></div><div id="after" class="next"></div>
<footer id="footer"></footer>
</main><script type="application/json" id="data">{"days": [{"date": "2026-10-15", "restaurants": [{"name": "Restaurant Principal", "items": [{"type": "Saine Attitude", "label": "Brouillade d'oeufs aux poivrons"}, {"type": "Le Marché", "label": "Pavé de saumon au beurre Nantais"}, {"type": "BBQ \u0026 Co", "label": "Haché de veau au poivre"}, {"type": "Bistronomie", "label": "Semaine du goût : Boeuf Bourguignon revisité en parmentier, jus réduit"}, {"type": "Les Comptoirs", "label": "Jambon rôti au Madère"}]}]}, {"date": "2026-10-16", "restaurants": [{"name": "Restaurant Principal", "items": [{"type": "Saine Attitude", "label": "Pizza aux 4 fromages"}, {"type": "Trattoria", "label": "Friday Lunch"}]}]}], "updated": "16/10/2026 à 18:35", "updatedAt": "2026-10-16T18:35+02:00"}</script><script>
'use strict';
const data=JSON.parse(document.getElementById('data').textContent), days=data.days, $=id=>document.getElementById(id);
const key=d=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
const label=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});
const at=s=>new Date(s+'T12:00:00Z');
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
// Stations (emoji par défaut + couleur) et plats (emoji d'après les mots du libellé, le premier qui correspond).
const STATIONS=[[/saine/,'🥗','green'],[/marche/,'🐟','blue'],[/bbq|grill/,'🔥','orange'],[/trattoria|pasta/,'🍝','red'],
 [/bistro/,'🍷','purple'],[/comptoir/,'🥘','amber'],[/dessert/,'🍰','amber'],[/entree/,'🥗','green']];
const DISHES=[[/pizza/,'🍕'],[/burger/,'🍔'],[/friday/,'🎉'],[/salade/,'🥗'],[/quiche|tarte|tourte/,'🥧'],
 [/vegetal|vegetarien|vegan|lentille|pois chiche|falafel|tofu/,'🌱'],
 [/pates|spaghetti|tagliatelle|lasagne|agnolon|raviol|gnocchi|penne|macaroni|tortellini/,'🍝'],
 [/cabillaud|colin|\blieu\b|saumon|poisson|merlu|thon|crevette|truite|dorade|haddock|moule/,'🐟'],
 [/steak|boeuf|entrecote|hache|bourguignon|veau|paupiette|rumsteck|bavette/,'🥩'],
 [/poulet|dinde|volaille|canard|pintade|escalope/,'🍗'],[/saucisse|knack|merguez|chipolata/,'🌭'],
 [/jambon|lard|bacon|porc/,'🥓'],[/agneau|lapin|navarin|gigot/,'🍖'],[/oeuf|omelette|brouillade|frittata/,'🍳'],
 [/\briz\b|risotto|paella|pilaf/,'🍚'],[/soupe|veloute|potage|bouillon/,'🍲'],[/fromage/,'🧀'],
 [/gratin|puree|pomme de terre|parmentier|frites/,'🥔'],[/fruit|compote|\bpomme\b|poire|banane/,'🍎'],
 [/gateau|mousse|creme|flan|brownie|cookie|tiramisu/,'🍰']];
const TASTE=/^\s*semaine du go[uû]t\s*:?\s*/i;
function look(item){
 const station=STATIONS.find(s=>s[0].test(norm(item.type)))||[null,'🍽️',''];
 const dish=DISHES.find(d=>d[0].test(norm(item.label)));
 return {emoji:dish?dish[1]:station[1],color:station[2]};
}
function nameOf(dateKey,todayKey){
 const plus=n=>key(new Date(at(todayKey).getTime()+n*86400000));
 if(dateKey===todayKey)return '🍽️ Aujourd’hui · '+label.format(at(dateKey));
 if(dateKey===plus(1))return '🥐 Demain · '+label.format(at(dateKey));
 return '📅 '+cap(label.format(at(dateKey)));
}
function cards(day){
 const frag=document.createDocumentFragment();
 for(const r of day.restaurants){
  const card=node('section','','card');card.append(node('h2','🏫 '+r.name));
  for(const item of r.items){
   const {emoji,color}=look(item), taste=TASTE.test(item.label), row=node('div','','dish '+color);
   const tile=node('span',emoji,'tile');tile.setAttribute('aria-hidden','true');
   const text=node('div','','text'), type=node('div','','type');
   if(item.type)type.append(item.type);
   if(taste)type.append(node('span','🎨 Semaine du goût','badge'));
   if(item.type||taste)text.append(type);
   text.append(node('div',item.label.replace(TASTE,''),'label'));
   row.append(tile,text);card.append(row);
  }
  frag.append(card);
 }
 return frag;
}
let index=Math.max(0,days.findIndex(d=>d.date>=key(new Date())));
if(!days.some(d=>d.date>=key(new Date())))index=days.length-1;
function show(){
 const todayKey=key(new Date()), day=days[index];
 $('title').textContent=nameOf(day.date,todayKey);
 $('menu').replaceChildren(cards(day));
 $('after').replaceChildren();
 const upcoming=days[index+1];
 if(upcoming&&day.date>=todayKey){
  const more=node('details');more.append(node('summary',nameOf(upcoming.date,todayKey)),cards(upcoming));$('after').append(more);
 }
 $('prev').disabled=index<=0;$('next').disabled=index>=days.length-1;
}
$('prev').onclick=()=>{index=Math.max(0,index-1);show();};
$('next').onclick=()=>{index=Math.min(days.length-1,index+1);show();};
$('today').onclick=()=>{const t=days.findIndex(d=>d.date>=key(new Date()));index=t<0?days.length-1:t;show();};
const age=data.updatedAt?(Date.now()-new Date(data.updatedAt).getTime())/36e5:0;
if(age>36){const d=Math.floor(age/24);$('alert').append(node('p','⚠️ Menu non actualisé depuis '+d+' jour'+(d>1?'s':'')+' : la connexion à myMRS a échoué. Le dernier menu connu est affiché.','warn'));}
const footer=$('footer');footer.append('🔄 Mis à jour le '+data.updated+' · ');
const link=node('a','myMRS');link.href='https://www.mymrs.fr/home';link.target='_blank';link.rel='noopener';footer.append(link);
show();
</script></body></html>
