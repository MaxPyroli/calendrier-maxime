name: Actualiser le calendrier

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - template.html
      - weekly.py
      - filter_calendar.py
      - rules.json
      - requirements.txt
      - tests/**
      - .github/workflows/calendar.yml

# Le site est servi par GitHub Pages depuis la branche main (racine) :
# le workflow régénère index.html puis le commit seulement si la génération réussit.
permissions:
  contents: write

concurrency:
  group: calendrier
  cancel-in-progress: false

jobs:
  actualiser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover -s tests -v

      # Échoue sans rien publier si la source est vide ou invalide :
      # la dernière version en ligne reste alors en place.
      - name: Générer la page
        run: python weekly.py

      - name: Publier si la page a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html audit.json
          if git diff --cached --quiet; then
            echo "Aucun changement à publier."
            exit 0
          fi
          git commit -m "Actualise le calendrier ($(date -u '+%Y-%m-%d %H:%M') UTC)"
          git push
